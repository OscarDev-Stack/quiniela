name: Deploy Firebase

on:
  push:
    branches:
      - develop   # -> proyecto de desarrollo
      - master    # -> produccion (con aprobacion manual)

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Gate manual solo en master; develop pasa directo
    environment: ${{ github.ref == 'refs/heads/master' && 'produccion' || 'desarrollo' }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          # Necesitamos el commit anterior para saber qué cambió.
          fetch-depth: 2

      # Detecta si el push tocó las Cloud Functions o las reglas de Firestore.
      # Así solo desplegamos lo que de verdad cambió y evitamos el 429 de quota
      # por redesplegar las ~65 funciones cuando el cambio fue solo de front.
      - name: Detectar cambios
        id: cambios
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            DIFF=$(git diff --name-only HEAD~1 HEAD)
          else
            DIFF=$(git diff --name-only HEAD)
          fi
          echo "Archivos cambiados:"; echo "$DIFF"
          if echo "$DIFF" | grep -q '^functions/'; then
            echo "functions=true" >> "$GITHUB_OUTPUT"
          else
            echo "functions=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$DIFF" | grep -q '^firestore.rules'; then
            echo "reglas=true" >> "$GITHUB_OUTPUT"
          else
            echo "reglas=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Cachea node_modules ENTERO (no solo el cache de npm). Si el lockfile no
      # cambió, se restaura tal cual y nos saltamos el `npm ci` completo.
      - name: Cachear node_modules (raíz)
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          # Clave atada a SO, versión de Node y lockfile: si algo cambia, reinstala.
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Instalar dependencias
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      # Compila con la config segun la rama (dev o produccion). build:prod y
      # build:dev tambien generan el service worker de messaging con el
      # firebaseConfig del entorno correcto (scripts/generar-sw.js).
      - name: Compilar Angular
        run: |
          if [ "${GITHUB_REF##*/}" = "master" ]; then
            npm run build:prod
          else
            npm run build:dev
          fi

      # Escribe la llave del SA correcto para que la CLI de Firebase autentique
      - name: Autenticar Firebase CLI
        run: |
          echo '${{ github.ref == 'refs/heads/master' && secrets.FIREBASE_SA_PROD || secrets.FIREBASE_SA_DEV }}' > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # Deps de funciones: solo si el push tocó functions/. Cachea
      # functions/node_modules entero; si el lockfile no cambió, se restaura y
      # se salta el `npm ci`.
      - name: Cachear node_modules (functions)
        if: steps.cambios.outputs.functions == 'true'
        id: cache-node-modules-functions
        uses: actions/cache@v4
        with:
          path: functions/node_modules
          key: node-modules-functions-${{ runner.os }}-node20-${{ hashFiles('functions/package-lock.json') }}

      - name: Instalar dependencias de funciones
        if: steps.cambios.outputs.functions == 'true' && steps.cache-node-modules-functions.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: functions

      # Cachea la CLI de Firebase (es grande) para no bajarla en cada corrida.
      # La clave incluye la versión: si se sube firebase-tools, la caché se
      # invalida sola y se reinstala.
      - name: Cachear Firebase CLI
        if: steps.cambios.outputs.functions == 'true' || steps.cambios.outputs.reglas == 'true'
        id: cache-firebase
        uses: actions/cache@v4
        with:
          path: ~/.npm-global
          key: firebase-tools-15.22.1-${{ runner.os }}

      - name: Instalar Firebase CLI
        if: (steps.cambios.outputs.functions == 'true' || steps.cambios.outputs.reglas == 'true') && steps.cache-firebase.outputs.cache-hit != 'true'
        run: npm install --prefix ~/.npm-global -g firebase-tools@15.22.1

      # Deja la CLI cacheada en el PATH (haya venido de caché o recién instalada).
      - name: Firebase CLI en PATH
        if: steps.cambios.outputs.functions == 'true' || steps.cambios.outputs.reglas == 'true'
        run: echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"

      # Despliega SOLO las funciones si cambió functions/. Reintenta ante el 429
      # "Per project mutation requests per minute" (transitorio; el deploy es
      # idempotente y retoma las que faltan).
      - name: Deploy funciones
        if: steps.cambios.outputs.functions == 'true'
        run: |
          PROY=${{ github.ref == 'refs/heads/master' && 'quinelav1-e23eb' || 'quiniela-dev-d203d' }}
          for intento in 1 2 3; do
            echo "Deploy de funciones (intento $intento)..."
            if firebase deploy --only functions --project "$PROY" --non-interactive; then
              echo "Deploy de funciones OK."
              break
            fi
            if [ "$intento" -eq 3 ]; then
              echo "Deploy de funciones fallo tras 3 intentos."
              exit 1
            fi
            echo "Fallo (posible quota 429). Esperando 60s antes de reintentar..."
            sleep 60
          done

      # Despliega las reglas de Firestore solo si cambiaron.
      - name: Deploy reglas de Firestore
        if: steps.cambios.outputs.reglas == 'true'
        run: |
          PROY=${{ github.ref == 'refs/heads/master' && 'quinelav1-e23eb' || 'quiniela-dev-d203d' }}
          firebase deploy --only firestore:rules --project "$PROY" --non-interactive

      # Despliega hosting al proyecto que corresponde a la rama
      - name: Deploy hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ github.ref == 'refs/heads/master' && secrets.FIREBASE_SA_PROD || secrets.FIREBASE_SA_DEV }}
          projectId: ${{ github.ref == 'refs/heads/master' && 'quinelav1-e23eb' || 'quiniela-dev-d203d' }}
          target: principal
          channelId: live
