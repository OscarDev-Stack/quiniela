name: Deploy Firebase

on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Compilar Angular
        run: npm run build

      - name: Autenticar con Google Cloud
        uses: google-github-actions/auth@v2
        with:
         workload_identity_provider: 'projects/747605502963/locations/global/workloadIdentityPools/github-actions/providers/github'
         service_account: 'github-deployer@quinielav1-e23eb.iam.gserviceaccount.com'
         create_credentials_file: true

      - name: Verificar autenticación
        run: gcloud auth list

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools@15.22.1

      - name: Deploy Firebase Hosting
        run: firebase deploy --only hosting:principal --project quinielav1-e23eb
